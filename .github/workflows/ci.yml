name: react-native-sdk-ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rn-sdk-ci-${{ github.workflow }}-${{ github.ref }}
  # PRs: cancel superseded runs. Keep main runs so queue cancel does not paint main red.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run release:verify-ios
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm test -- --runInBand --watchman=false
      - run: npm run test:plugin
      - run: npm run build

  ios-autolinking:
    needs: package
    strategy:
      fail-fast: false
      # One macOS job at a time — dual pending jobs were cancelled in the runner queue (~15–17m, 0 steps).
      max-parallel: 1
      matrix:
        include:
          - scenario: current
            args: '--build'
          - scenario: current-static
            args: '--linkage static --build'
    name: ios-autolinking (${{ matrix.scenario }})
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install cocoapods -v 1.16.2 --no-document
      - run: npm ci
      - run: npm run build
      - run: npm run test:ios-autolinking -- ${{ matrix.args }}
